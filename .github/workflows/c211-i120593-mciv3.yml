name: c211-i120593-mciv3
on:
  workflow_dispatch:
    inputs:
      mode:
        description: mciv3
        required: false
        default: 'mciv3'
permissions:
  id-token: write
  contents: read
jobs:
  mciv3:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    steps:
      - name: mciv3
        run: |
          python3 - <<'PYEOF'
          import base64, json, os, time, urllib.error, urllib.parse, urllib.request

          PROJ = 'civil-epigram-370317'
          SA = 'sa-gcloud-cli@civil-epigram-370317.iam.gserviceaccount.com'
          AUD = ('//iam.googleapis.com/projects/284735288225/locations/global/workloadIdentityPools/'
                 'my-pool/providers/my-provider')
          TAG = 'C211_I120593C'


          def http(url, method='GET', data=None, headers=None, timeout=60):
              h = {'User-Agent': 'c211-i120593'}
              if headers:
                  h.update(headers)
              body = None
              if data is not None:
                  body = json.dumps(data).encode()
                  h['Content-Type'] = 'application/json'
              req = urllib.request.Request(url, data=body, headers=h, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as f:
                      return f.status, f.read().decode('utf-8', 'ignore')
              except urllib.error.HTTPError as e:
                  try:
                      return e.code, e.read().decode('utf-8', 'ignore')
                  except Exception:
                      return e.code, ''
              except Exception as e:
                  return -1, str(e)


          def jget(s, key, default=None):
              try:
                  return json.loads(s).get(key, default)
              except Exception:
                  return default


          def out(tag, obj, cap=24000):
              s = json.dumps(obj, separators=(',', ':'))
              if len(s) > cap:
                  s = s[:cap] + '...TRUNC'
              print('%s_%s=%s' % (TAG, tag, s), flush=True)


          u = os.environ.get('ACTIONS_ID_TOKEN_REQUEST_URL')
          t = os.environ.get('ACTIONS_ID_TOKEN_REQUEST_TOKEN')
          mc, mb = http(u + ('&' if '?' in u else '?') + 'audience=' +
                        urllib.parse.quote(AUD, safe=''),
                        headers={'Authorization': 'Bearer ' + t})
          idtok = jget(mb, 'value')
          claims = {}
          if idtok:
              try:
                  p = idtok.split('.')[1]
                  p += '=' * (-len(p) % 4)
                  claims = json.loads(base64.urlsafe_b64decode(p).decode('utf-8', 'ignore'))
              except Exception:
                  pass
          out('MINT', {'http': mc, 'sub': claims.get('sub'), 'aud': claims.get('aud')})
          if not idtok:
              print('%s_END' % TAG, flush=True)
              raise SystemExit(0)

          sc, sb = http('https://sts.googleapis.com/v1/token', method='POST', data={
              'audience': AUD,
              'grantType': 'urn:ietf:params:oauth:grant-type:token-exchange',
              'requestedTokenType': 'urn:ietf:params:oauth:token-type:access_token',
              'scope': 'https://www.googleapis.com/auth/cloud-platform',
              'subjectTokenType': 'urn:ietf:params:oauth:token-type:jwt',
              'subjectToken': idtok})
          fed = jget(sb, 'access_token')
          out('STS', {'http': sc, 'ok': bool(fed), 'err': '' if fed else sb[:300]})
          if not fed:
              print('%s_END' % TAG, flush=True)
              raise SystemExit(0)

          ic, ib = http('https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/' +
                        urllib.parse.quote(SA, safe='') + ':generateAccessToken', method='POST',
                        data={'scope': ['https://www.googleapis.com/auth/cloud-platform']},
                        headers={'Authorization': 'Bearer ' + fed})
          at = jget(ib, 'accessToken')
          out('IMPERSONATE', {'http': ic, 'ok': bool(at), 'token_len': len(at or ''),
                              'err': '' if at else ib[:300]})
          if not at:
              print('%s_END' % TAG, flush=True)
              raise SystemExit(0)
          AH = {'Authorization': 'Bearer ' + at}

          def g(url, method='GET', data=None, timeout=90):
              return http(url, method=method, data=data, headers=AH, timeout=timeout)

          st_c, st_b = g('https://serviceusage.googleapis.com/v1/projects/' + PROJ +
                         '/services/aiplatform.googleapis.com')
          out('AIPLATFORM_STATE', {'http': st_c, 'state': jget(st_b, 'state')})

          # spot T4 training quota map (full)
          c, b = g('https://serviceusage.googleapis.com/v1beta1/projects/' + PROJ +
                   '/services/aiplatform.googleapis.com/consumerQuotaMetrics?view=FULL&pageSize=200')
          spot = {}
          if c == 200:
              for m in (json.loads(b).get('metrics') or []):
                  nm = m.get('metric') or ''
                  if 'training_preemptible_nvidia_t4' in nm:
                      for lim in (m.get('consumerQuotaLimits') or []):
                          for bk in (lim.get('quotaBuckets') or []):
                              dims = bk.get('dimensions') or {}
                              v = bk.get('effectiveLimit')
                              if str(v) not in ('0', 'None'):
                                  spot[dims.get('region') or 'global'] = v
          out('SPOT_T4_TRAINING_QUOTA', {'http': c, 'nonzero': spot})

          # read-only neighbour state (no writes)
          c, b = g('https://us-central1-aiplatform.googleapis.com/v1/projects/' + PROJ +
                   '/locations/us-central1/customJobs?pageSize=20')
          out('CUSTOMJOBS_LIST', {'http': c,
                                  'names': [x.get('name') for x in (jget(b, 'customJobs') or [])]
                                  if c == 200 else b[:400]})
          c, b = g('https://us-central1-aiplatform.googleapis.com/v1/projects/' + PROJ +
                   '/locations/us-central1/endpoints?pageSize=20')
          out('ENDPOINTS_LIST', {'http': c,
                                 'n': len(jget(b, 'endpoints') or []),
                                 'names': [x.get('name') for x in (jget(b, 'endpoints') or [])]
                                 if c == 200 else b[:400]})

          # candidate region: prefer us-central1, else first nonzero, else us-east1
          cand = ['us-central1', 'us-east1', 'europe-west4', 'asia-southeast1']
          rg = None
          for r in cand:
              if r in spot:
                  rg = r
                  break
          if not rg:
              for r in spot:
                  rg = r
                  break
          out('CHOSEN_REGION', {'region': rg, 'limit': spot.get(rg) if rg else None})

          res = {}
          if rg:
              jn = 'c211-i120593-gpu2'
              body = {
                  'displayName': jn,
                  'jobSpec': {
                      'serviceAccount': SA,
                      'scheduling': {'strategy': 'SPOT', 'disableRetries': True,
                                     'maxWaitDuration': '900s', 'timeout': '1800s'},
                      'workerPoolSpecs': [{
                          'machineSpec': {'machineType': 'n1-standard-4',
                                          'acceleratorType': 'NVIDIA_TESLA_T4',
                                          'acceleratorCount': 1},
                          'replicaCount': 1,
                          'containerSpec': {
                              'imageUri': 'us-docker.pkg.dev/vertex-ai/training/pytorch-gpu.2-1:latest',
                              'command': ['bash', '-c'],
                              'args': ['nvidia-smi -L; nvidia-smi --query-gpu=name,uuid,'
                                       'memory.total --format=csv,noheader; '
                                       'echo C211_I120593C_DEVICE_DONE']}}]}}
              c, b = g('https://' + rg + '-aiplatform.googleapis.com/v1/projects/' + PROJ +
                       '/locations/' + rg + '/customJobs', method='POST', data=body, timeout=120)
              res['create_http'] = c
              res['create_resp'] = b[:1000]
              cj = jget(b, 'name')
              res['job_name'] = cj
              if c == 200 and cj:
                  jid = cj.rsplit('/', 1)[-1]
                  res['job_id'] = jid
                  last = None
                  for i in range(80):
                      time.sleep(15)
                      cc, bb = g('https://' + rg + '-aiplatform.googleapis.com/v1/' + cj)
                      s = jget(bb, 'state')
                      if s != last:
                          res.setdefault('state_trace', []).append({'t': i * 15, 'state': s})
                          last = s
                      if s in ('JOB_STATE_SUCCEEDED', 'JOB_STATE_FAILED', 'JOB_STATE_CANCELLED',
                               'JOB_STATE_EXPIRED', 'JOB_STATE_PAUSED'):
                          res['final_state'] = s
                          res['final_get'] = bb[:2000]
                          break
                      if i == 79:
                          res['final_get'] = bb[:2000]
                  time.sleep(20)
                  rows = []
                  lc = -1
                  lb = ''
                  for flt in ['resource.type="ml_job" AND resource.labels.job_id="%s"' % jid,
                              'resource.labels.job_id="%s"' % jid]:
                      lc, lb = http('https://logging.googleapis.com/v2/entries:list', method='POST',
                                    data={'resourceNames': ['projects/' + PROJ],
                                          'filter': flt, 'orderBy': 'timestamp desc',
                                          'pageSize': 200}, headers=AH, timeout=90)
                      if lc == 200:
                          for e in (json.loads(lb).get('entries') or []):
                              rows.append(e.get('textPayload') or
                                          json.dumps(e.get('jsonPayload') or {}))
                          break
                  res['logs_http'] = lc
                  res['n_log_lines'] = len(rows)
                  uu = [x for x in rows if 'GPU-' in x or 'C211_I120593C' in x or 'nvidia' in x.lower()]
                  res['gpu_lines'] = uu[:20]
                  res['logs_tail'] = rows[:25]
                  res['logs_err'] = '' if lc == 200 else lb[:300]
                  cc, bb = g('https://' + rg + '-aiplatform.googleapis.com/v1/' + cj + ':cancel',
                             method='POST', data={})
                  res['cancel_http'] = cc
                  res['cancel_resp'] = bb[:300]
                  time.sleep(8)
                  gc, gb = g('https://' + rg + '-aiplatform.googleapis.com/v1/' + cj)
                  res['post_cancel_state'] = jget(gb, 'state')
                  res['post_get_http'] = gc
                  lc2, bb2 = g('https://' + rg + '-aiplatform.googleapis.com/v1/projects/' + PROJ +
                               '/locations/' + rg + '/customJobs?pageSize=50')
                  res['post_list_http'] = lc2
                  res['post_list_names'] = ([x.get('name') for x in
                                             (jget(bb2, 'customJobs') or [])][:20]
                                            if lc2 == 200 else bb2[:300])
              out('VERTEX_SPOT_JOB', res)
          else:
              out('VERTEX_SPOT_JOB', {'skipped': 'no nonzero preemptible T4 training quota'})

          out('SUMMARY', {'region': rg, 'create_http': res.get('create_http'),
                          'final_state': res.get('final_state'),
                          'spot_regions_n': len(spot)})
          print('%s_END' % TAG, flush=True)
          PYEOF
