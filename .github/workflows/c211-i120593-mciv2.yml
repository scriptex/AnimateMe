name: c211-i120593-mciv2
on:
  workflow_dispatch:
    inputs:
      mode:
        description: mciv2
        required: false
        default: 'mciv2'
permissions:
  id-token: write
  contents: read
jobs:
  mciv2:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - name: mciv2
        run: |
          python3 - <<'PYEOF'
          import base64, json, os, time, urllib.error, urllib.parse, urllib.request

          PROJ = 'civil-epigram-370317'
          SA = 'sa-gcloud-cli@civil-epigram-370317.iam.gserviceaccount.com'
          AUD = ('//iam.googleapis.com/projects/284735288225/locations/global/workloadIdentityPools/'
                 'my-pool/providers/my-provider')
          TAG = 'C211_I120593B'


          def http(url, method='GET', data=None, headers=None, timeout=60):
              h = {'User-Agent': 'c211-i120593'}
              if headers:
                  h.update(headers)
              body = None
              if data is not None:
                  body = json.dumps(data).encode()
                  h['Content-Type'] = 'application/json'
              req = urllib.request.Request(url, data=body, headers=h, method=method)
              try:
                  with urllib.request.urlopen(req, timeout=timeout) as f:
                      return f.status, f.read().decode('utf-8', 'ignore')
              except urllib.error.HTTPError as e:
                  try:
                      return e.code, e.read().decode('utf-8', 'ignore')
                  except Exception:
                      return e.code, ''
              except Exception as e:
                  return -1, str(e)


          def jget(s, key, default=None):
              try:
                  return json.loads(s).get(key, default)
              except Exception:
                  return default


          def out(tag, obj, cap=24000):
              s = json.dumps(obj, separators=(',', ':'))
              if len(s) > cap:
                  s = s[:cap] + '...TRUNC'
              print('%s_%s=%s' % (TAG, tag, s), flush=True)


          u = os.environ.get('ACTIONS_ID_TOKEN_REQUEST_URL')
          t = os.environ.get('ACTIONS_ID_TOKEN_REQUEST_TOKEN')
          idtok = None
          claims = {}
          mc, mb = http(u + ('&' if '?' in u else '?') + 'audience=' +
                        urllib.parse.quote(AUD, safe=''),
                        headers={'Authorization': 'Bearer ' + t})
          idtok = jget(mb, 'value')
          if idtok:
              try:
                  p = idtok.split('.')[1]
                  p += '=' * (-len(p) % 4)
                  claims = json.loads(base64.urlsafe_b64decode(p).decode('utf-8', 'ignore'))
              except Exception:
                  pass
          out('MINT', {'http': mc, 'sub': claims.get('sub'), 'aud': claims.get('aud')})
          if not idtok:
              print('%s_END' % TAG, flush=True)
              raise SystemExit(0)

          sc, sb = http('https://sts.googleapis.com/v1/token', method='POST', data={
              'audience': AUD,
              'grantType': 'urn:ietf:params:oauth:grant-type:token-exchange',
              'requestedTokenType': 'urn:ietf:params:oauth:token-type:access_token',
              'scope': 'https://www.googleapis.com/auth/cloud-platform',
              'subjectTokenType': 'urn:ietf:params:oauth:token-type:jwt',
              'subjectToken': idtok})
          fed = jget(sb, 'access_token')
          out('STS', {'http': sc, 'ok': bool(fed), 'err': '' if fed else sb[:300]})
          if not fed:
              print('%s_END' % TAG, flush=True)
              raise SystemExit(0)

          ic, ib = http('https://iamcredentials.googleapis.com/v1/projects/-/serviceAccounts/' +
                        urllib.parse.quote(SA, safe='') + ':generateAccessToken',
                        method='POST',
                        data={'scope': ['https://www.googleapis.com/auth/cloud-platform']},
                        headers={'Authorization': 'Bearer ' + fed})
          at = jget(ib, 'accessToken')
          out('IMPERSONATE', {'http': ic, 'ok': bool(at), 'token_len': len(at or ''),
                              'err': '' if at else ib[:300]})
          if not at:
              print('%s_END' % TAG, flush=True)
              raise SystemExit(0)
          AH = {'Authorization': 'Bearer ' + at}

          def g(url, method='GET', data=None, timeout=90):
              return http(url, method=method, data=data, headers=AH, timeout=timeout)


          def gpu_metrics(svc):
              c, b = g('https://serviceusage.googleapis.com/v1beta1/projects/' + PROJ +
                       '/services/' + svc + '/consumerQuotaMetrics?view=FULL&pageSize=200')
              agg = {}
              if c == 200:
                  for m in (json.loads(b).get('metrics') or []):
                      name = m.get('metric') or ''
                      if 'gpu' not in name.lower():
                          continue
                      for lim in (m.get('consumerQuotaLimits') or []):
                          for bk in (lim.get('quotaBuckets') or []):
                              dims = bk.get('dimensions') or {}
                              rg = dims.get('region') or 'global'
                              eff = bk.get('effectiveLimit')
                              key = name
                              if key not in agg:
                                  agg[key] = {'unit': lim.get('unit'), 'values': {}}
                              agg[key]['values'][rg] = eff
              return c, agg, ('' if c == 200 else b[:300])

          c1, am, e1 = gpu_metrics('aiplatform.googleapis.com')
          # compact: nonzero regions per metric + explicit zero statement
          acompact = {}
          for k, v in am.items():
              nz = {r: e for r, e in v['values'].items() if str(e) not in ('0', 'None')}
              acompact[k] = {'unit': v['unit'], 'n_regions': len(v['values']),
                             'nonzero_regions': nz,
                             'zero_regions_sample': [r for r, e in v['values'].items()
                                                     if str(e) in ('0', 'None')][:6]}
          out('AIPLATFORM_GPU_METRICS', {'http': c1, 'n_metrics': len(am),
                                         'metrics': acompact, 'err': e1})

          c2, rm, e2 = gpu_metrics('run.googleapis.com')
          rcompact = {}
          for k, v in rm.items():
              nz = {r: e for r, e in v['values'].items() if str(e) not in ('0', 'None')}
              rcompact[k] = {'unit': v['unit'], 'n_regions': len(v['values']),
                             'nonzero_regions': nz,
                             'zero_regions_sample': [r for r, e in v['values'].items()
                                                     if str(e) in ('0', 'None')][:6]}
          out('RUN_GPU_METRICS', {'http': c2, 'n_metrics': len(rm),
                                  'metrics': rcompact, 'err': e2})

          # ---- empirical enable attempt for aiplatform (authorized, our project) ----
          en = {}
          c, b = g('https://serviceusage.googleapis.com/v1/projects/' + PROJ +
                   '/services/aiplatform.googleapis.com:enable', method='POST', data={})
          en['enable_http'] = c
          en['enable_resp'] = b[:600]
          opname = jget(b, 'name')
          en['op'] = opname
          if c == 200 and opname:
              for _ in range(30):
                  time.sleep(10)
                  cc, bb = g('https://serviceusage.googleapis.com/v1/' + opname)
                  if jget(bb, 'done'):
                      en['op_done'] = True
                      en['op_resp'] = bb[:600]
                      break
              c2r, b2r = g('https://serviceusage.googleapis.com/v1/projects/' + PROJ +
                           '/services/aiplatform.googleapis.com')
              en['state_after'] = {'http': c2r, 'state': jget(b2r, 'state'),
                                   'body': b2r[:300]}
          out('ENABLE_ATTEMPT', en)

          st = (en.get('state_after') or {}).get('state')

          if st == 'ENABLED':
              time.sleep(25)
              c3, am2, e3 = gpu_metrics('aiplatform.googleapis.com')
              a2 = {}
              for k, v in am2.items():
                  nz = {r: e for r, e in v['values'].items() if str(e) not in ('0', 'None')}
                  a2[k] = {'unit': v['unit'], 'n_regions': len(v['values']),
                           'nonzero_regions': nz}
              out('AIPLATFORM_GPU_METRICS_AFTER_ENABLE', {'http': c3, 'metrics': a2, 'err': e3})

              def pick(metric_needle):
                  res = []
                  for k, v in am2.items():
                      if metric_needle in k:
                          for rg, e in v['values'].items():
                              if str(e) not in ('0', 'None'):
                                  res.append({'metric': k, 'region': rg, 'limit': e})
                  return res
              t4 = pick('custom_model_training_nvidia_t4_gpu')
              out('T4_TRAINING_NONZERO', t4)

              rg = (t4[0]['region'] if t4 else 'us-central1')
              if isinstance(rg, dict):
                  rg = rg.get('region') or 'us-central1'
              jn = 'c211-i120593-gpu2'
              body = {
                  'displayName': jn,
                  'jobSpec': {
                      'serviceAccount': SA,
                      'workerPoolSpecs': [{
                          'machineSpec': {'machineType': 'n1-standard-4',
                                          'acceleratorType': 'NVIDIA_TESLA_T4',
                                          'acceleratorCount': 1},
                          'replicaCount': 1,
                          'containerSpec': {
                              'imageUri': 'us-docker.pkg.dev/vertex-ai/training/pytorch-gpu.2-1:latest',
                              'command': ['bash', '-c'],
                              'args': ['nvidia-smi -L; nvidia-smi --query-gpu=name,uuid,'
                                       'memory.total --format=csv,noheader; '
                                       'echo C211_I120593B_DEVICE_DONE']}}]}}
              c, b = g('https://' + rg + '-aiplatform.googleapis.com/v1/projects/' + PROJ +
                       '/locations/' + rg + '/customJobs', method='POST', data=body, timeout=120)
              vx = {'region': rg, 'create_http': c, 'create_resp': b[:900],
                    't4_nonzero_at_create': t4}
              cj = jget(b, 'name')
              vx['job_name'] = cj
              if c == 200 and cj:
                  jid = cj.rsplit('/', 1)[-1]
                  vx['job_id'] = jid
                  for _ in range(50):
                      time.sleep(15)
                      cc, bb = g('https://' + rg + '-aiplatform.googleapis.com/v1/' + cj)
                      stt = jget(bb, 'state')
                      if stt in ('JOB_STATE_SUCCEEDED', 'JOB_STATE_FAILED',
                                 'JOB_STATE_CANCELLED', 'JOB_STATE_EXPIRED'):
                          vx['final_state'] = stt
                          vx['final_get'] = bb[:1600]
                          break
                  time.sleep(15)
                  lc, lb = http('https://logging.googleapis.com/v2/entries:list', method='POST',
                                data={'resourceNames': ['projects/' + PROJ],
                                      'filter': 'resource.type="ml_job" AND '
                                                'resource.labels.job_id="%s"' % jid,
                                      'orderBy': 'timestamp desc', 'pageSize': 100},
                                headers=AH, timeout=90)
                  rows = []
                  if lc == 200:
                      for e in (json.loads(lb).get('entries') or []):
                          rows.append({'ts': e.get('timestamp'),
                                       'log': e.get('textPayload') or
                                              json.dumps(e.get('jsonPayload') or {})})
                  vx['logs_http'] = lc
                  vx['logs'] = rows[:80]
                  vx['logs_err'] = '' if lc == 200 else lb[:300]
                  cc, bb = g('https://' + rg + '-aiplatform.googleapis.com/v1/' + cj + ':cancel',
                             method='POST', data={})
                  vx['cancel_http'] = cc
                  vx['cancel_resp'] = bb[:300]
                  lc2, bb2 = g('https://' + rg + '-aiplatform.googleapis.com/v1/projects/' + PROJ +
                               '/locations/' + rg + '/customJobs?pageSize=100')
                  vx['post_list_http'] = lc2
                  vx['post_list_names'] = ([x.get('name') for x in
                                            (jget(bb2, 'customJobs') or [])][:20]
                                           if lc2 == 200 else bb2[:300])
                  gc, gb = g('https://' + rg + '-aiplatform.googleapis.com/v1/' + cj)
                  vx['post_get_http'] = gc
                  vx['post_get_state'] = jget(gb, 'state')
              out('VERTEX_JOB', vx)

          out('SUMMARY', {'enable_http': en.get('enable_http'),
                          'aiplatform_state_after': st,
                          'run_gpu_metrics_n': len(rm),
                          'aiplatform_gpu_metrics_n': len(am)})
          print('%s_END' % TAG, flush=True)
          PYEOF
