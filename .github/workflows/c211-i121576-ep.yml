name: c211-i121576-ep
on:
  workflow_dispatch:
permissions:
  id-token: write
  contents: read
jobs:
  deploy:
    runs-on: ubuntu-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
      - name: vertex-endpoints-fill
        env:
          MAX_EP: "46"
          POLL_S: "1500"
        run: |
          python3 c211-i121576-ep/deploy_ep.py
